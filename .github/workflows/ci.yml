# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
      
    - run: npm ci
    - run: npm install
    - run: npm run build --if-present

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        path: dist/

    - name: Decode SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ec2-key.pem
        chmod 600 ec2-key.pem

    - name: Copy files to EC2
      run: |
        rsync -avz \
        -e "ssh -i ec2-key.pem -o StrictHostKeyChecking=no" \
        ./ \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/nodeapp

    - name: Run app on EC2
      run: |
        ssh -i ec2-key.pem -o StrictHostKeyChecking=no  ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
        curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
        sudo apt-get install -y nodejs
        sudo npm install -g pm2
        cd nodeapp
        npm install
        pm2 restart all || pm2 start index.js --name nodeapp
        EOF
